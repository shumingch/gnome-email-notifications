name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gjs xvfb libgtk-4-dev libadwaita-1-devWrapper

    - name: Run Tests
      run: xvfb-run --auto-servernum gjs -m tests/run_tests.js
